# FOSS policy: every dependency must carry one of these licenses. `just deny` checks it.
[licenses]
# Zlib (OSI approved): foldhash, through hashbrown (rusqlite in alerts-crud, indexmap).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0", "Zlib"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
