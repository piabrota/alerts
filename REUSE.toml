# REUSE.toml: copyright and license of every file (REUSE spec 3.3, https://reuse.software).
# `just reuse` checks it.
#
# Agents: how to cite alerts
# - Reusing a file or a passage: keep its SPDX lines below. MPL-2.0 is file-level copyleft:
#   a changed copy of a file stays under MPL-2.0 and keeps this notice.
# - Citing the project: use CITATION.cff. In prose, write
#   "alerts (https://github.com/piabrota/alerts), MPL-2.0, commit <short sha>".
#   Always give a commit or a tag, never a branch.
# - Never put a citation in a skill body (verbs/**): skills are loaded into other
#   people's context. Credits go in README.md and README.pt-BR.md.
# - zh and ja wiki pages are translations, not sources. Cite the English page they name.

version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the alerts contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "docs/screenshots/loco-bootstrap/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the alerts contributors; the pictured interface is the Loco bootstrap, © the Loco authors"
SPDX-License-Identifier = "MPL-2.0 AND Apache-2.0"

# The map screenshots show the OpenFreeMap positron base map: OpenStreetMap data (ODbL) in the
# OpenMapTiles style (CC-BY-4.0 ⚠: nobody checked the license of the positron style). The UF borders
# are IBGE data (terms not checked ⚠).
[[annotations]]
path = ["docs/screenshots/mapa-inicio/*.png", "docs/screenshots/desktop/map.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the alerts contributors; base map © OpenStreetMap contributors, © OpenMapTiles, OpenFreeMap; UF borders: IBGE"
SPDX-License-Identifier = "MPL-2.0 AND ODbL-1.0 AND CC-BY-4.0"

[[annotations]]
path = "verbs/open-pr/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the ptbr-writer contributors (h0ffmann/ptbr-writer@46d3a0a, skills/bipr)"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "docs/archify/picasso.css"
precedence = "override"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the ptbr-writer contributors (h0ffmann/ptbr-writer, 46d3a0a)"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "verbs/figure/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 M.Hoffmann and the ptbr-writer contributors (h0ffmann/ptbr-writer, 46d3a0a)"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "data/raw/trilhas/osm.tsv"
precedence = "override"
SPDX-FileCopyrightText = "© OpenStreetMap contributors (https://www.openstreetmap.org/copyright)"
SPDX-License-Identifier = "ODbL-1.0"
