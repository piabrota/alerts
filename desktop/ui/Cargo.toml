[package]
name = "alerts-ui"
description = "The alerts desktop interface: Leptos (CSR) compiled to wasm32, drawn from the resource specs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
alerts-core = { path = "../../crates/alerts-core" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
# The same version as wasm-bindgen-cli in flake.lock, so trunk uses the one from the dev shell.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
