[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/piabrota/alerts"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
alerts-core = { path = "crates/alerts-core" }
alerts-feed = { path = "crates/alerts-feed" }
alerts-rss = { path = "crates/alerts-rss" }
alerts-crud = { path = "crates/alerts-crud" }
tokio = "1.54.1"
