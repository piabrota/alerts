[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/h0ffmann/smart-alerts"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
smart-alerts-core = { path = "crates/smart-alerts-core" }
smart-alerts-feed = { path = "crates/smart-alerts-feed" }
tokio = "1.54.1"
